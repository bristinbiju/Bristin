<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: "B" monogram (generated by `npm run favicon` from favicon.svg).
         ?v=2 = icon version: bump it whenever the icon changes, so Google and browsers
         fetch the new file instead of reusing a cached copy of the old one. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Bristin Biju — Graphic &amp; Brand Designer</title>
    <meta name="description" content="Bristin Biju is a multidisciplinary graphic &amp; brand designer with 4+ years across Dubai, Europe, and Africa — crafting identities, campaigns, and digital experiences that perform." />
    <meta name="author" content="Bristin Biju" />
    <meta name="theme-color" content="#14191C" />

    <!-- Canonical -->
    <link rel="canonical" href="https://bristin.world/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bristin.world/" />
    <meta property="og:title" content="Bristin Biju — Graphic &amp; Brand Designer" />
    <meta property="og:description" content="Multidisciplinary graphic &amp; brand designer with 4+ years across Dubai, Europe, and Africa — crafting identities, campaigns, and digital experiences that perform." />
    <meta property="og:image" content="https://bristin.world/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Bristin Biju" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bristin Biju — Graphic &amp; Brand Designer" />
    <meta name="twitter:description" content="Multidisciplinary graphic &amp; brand designer with 4+ years across Dubai, Europe, and Africa — crafting identities, campaigns, and digital experiences that perform." />
    <meta name="twitter:image" content="https://bristin.world/og/home.jpg" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
